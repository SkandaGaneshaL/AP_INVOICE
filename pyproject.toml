[project]
name = "oci-invoice-rule-updater"
version = "0.1.0"
description = "OCI Generative AI invoice extraction-rule updater"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "oci>=2.160,<3",
  "oci-openai>=1.1.0,<2",
  "streamlit>=1.40,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<6",
  "python-dotenv>=1.0,<2",
  "pymupdf>=1.27.2,<2",
  "pillow>=12,<13",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8,<9"]
